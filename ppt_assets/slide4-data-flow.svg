<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OrderSuggest 資料流程</title>
  <desc id="desc">使用者經由前端介面送出請求，API 入口交由核心服務處理，再由 PostgreSQL 持久保存資料並以 Redis 管理 Session、快取與分散式鎖。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173967"/>
      <stop offset="1" stop-color="#2459A4"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08A9D4"/>
      <stop offset="1" stop-color="#28D2EF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#173A6A" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#21B8E2"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#8DA1BE"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>

  <text x="105" y="102" fill="#12233F" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="52" font-weight="700">資料如何在系統中流動</text>
  <text x="108" y="151" fill="#5B6B84" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="23">從使用者請求、服務處理，到資料保存與快取</text>

  <!-- Flow connectors behind the nodes -->
  <g fill="none" stroke="#21B8E2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 300 352 H 390"/>
    <path d="M 670 352 H 760"/>
    <path d="M 1040 352 H 1125"/>
  </g>
  <g fill="none" stroke="#21B8E2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 1210 457 V 540 H 1200 V 578"/>
    <path d="M 1370 457 V 520 H 1450 V 578"/>
  </g>

  <!-- User -->
  <g filter="url(#shadow)">
    <circle cx="205" cy="352" r="95" fill="#FFFFFF" stroke="#CAD8EB" stroke-width="3"/>
    <circle cx="205" cy="320" r="29" fill="none" stroke="#2459A4" stroke-width="10"/>
    <path d="M 151 400 C 161 353 249 353 259 400" fill="none" stroke="#2459A4" stroke-width="11" stroke-linecap="round"/>
  </g>
  <text x="205" y="485" text-anchor="middle" fill="#12233F" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="29" font-weight="700">使用者</text>
  <text x="205" y="519" text-anchor="middle" fill="#6B7A91" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20">輸入需求／上傳菜單</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="390" y="247" width="280" height="210" rx="28" fill="#FFFFFF" stroke="#CAD8EB" stroke-width="3"/>
    <rect x="420" y="280" width="220" height="136" rx="14" fill="#EEF5FF" stroke="#2459A4" stroke-width="5"/>
    <line x1="420" y1="316" x2="640" y2="316" stroke="#2459A4" stroke-width="5"/>
    <circle cx="443" cy="298" r="6" fill="#21B8E2"/>
    <circle cx="463" cy="298" r="6" fill="#8CA7CB"/>
    <rect x="448" y="342" width="110" height="13" rx="6" fill="#2459A4"/>
    <rect x="448" y="368" width="158" height="11" rx="5" fill="#9FB4D0"/>
  </g>
  <text x="530" y="495" text-anchor="middle" fill="#12233F" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="29" font-weight="700">前端介面</text>
  <text x="530" y="530" text-anchor="middle" fill="#6B7A91" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20">web.html ＋ web.js</text>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="760" y="247" width="280" height="210" rx="28" fill="url(#blueCard)"/>
    <path d="M 825 330 H 965" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M 975 380 H 835" stroke="#8DEBFF" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>
  <text x="900" y="495" text-anchor="middle" fill="#12233F" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="29" font-weight="700">API 入口</text>
  <text x="900" y="530" text-anchor="middle" fill="#6B7A91" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="20">back.py ＋ api_compat.py</text>

  <!-- Services -->
  <g filter="url(#shadow)">
    <rect x="1125" y="232" width="330" height="225" rx="30" fill="#FFFFFF" stroke="#CAD8EB" stroke-width="3"/>
    <rect x="1160" y="274" width="82" height="72" rx="16" fill="#DDF6FC"/>
    <rect x="1249" y="274" width="82" height="72" rx="16" fill="#E4EBFF"/>
    <rect x="1338" y="274" width="82" height="72" rx="16" fill="#EAE3FF"/>
    <path d="M 1184 311 h34 M 1201 294 v34" stroke="#079DC7" stroke-width="7" stroke-linecap="round"/>
    <path d="M 1271 310 h38 M 1271 325 h26" stroke="#355FA4" stroke-width="7" stroke-linecap="round"/>
    <path d="M 1360 326 l18 -30 l19 30 z" fill="none" stroke="#6A50B8" stroke-width="7" stroke-linejoin="round"/>
    <text x="1290" y="392" text-anchor="middle" fill="#173967" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700">核心服務</text>
    <text x="1290" y="426" text-anchor="middle" fill="#5B6B84" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="19">對話・菜單・推薦</text>
  </g>

  <!-- Arrow labels -->
  <g fill="#55708F" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
    <text x="345" y="330">操作</text>
    <text x="715" y="330">HTTP／SSE</text>
    <text x="1084" y="330">呼叫服務</text>
  </g>

  <!-- Storage nodes -->
  <g filter="url(#shadow)">
    <rect x="1050" y="578" width="300" height="186" rx="28" fill="url(#blueCard)"/>
    <ellipse cx="1122" cy="629" rx="42" ry="18" fill="#8DEBFF"/>
    <rect x="1080" y="629" width="84" height="57" fill="#8DEBFF"/>
    <ellipse cx="1122" cy="686" rx="42" ry="18" fill="#62D4F0"/>
    <text x="1178" y="643" fill="#FFFFFF" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="26" font-weight="700">PostgreSQL</text>
    <text x="1178" y="681" fill="#D5E8FF" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="17">菜單・評論・對話</text>
    <text x="1178" y="711" fill="#D5E8FF" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="17">長期持久保存</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1380" y="578" width="150" height="186" rx="28" fill="url(#cyanCard)"/>
    <path d="M 1450 612 l-28 52 h27 l-13 50 l47-66 h-29 l20-36 z" fill="#FFFFFF"/>
    <text x="1455" y="728" text-anchor="middle" fill="#063B53" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="700">Redis</text>
    <text x="1455" y="750" text-anchor="middle" fill="#0B536C" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="14">Session／快取／鎖</text>
  </g>

  <!-- Legacy import lane -->
  <g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <rect x="105" y="638" width="720" height="126" rx="24" fill="#FFFFFF" stroke="#C9D8EA" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="140" y="680" fill="#5B6B84" font-size="18" font-weight="700">既有資料搬移</text>
    <rect x="140" y="702" width="175" height="38" rx="12" fill="#EDF2F8"/>
    <text x="228" y="728" text-anchor="middle" fill="#29456C" font-size="18" font-weight="600">JSON／SQLite</text>
    <path d="M 335 721 H 465" fill="none" stroke="#8DA1BE" stroke-width="5" marker-end="url(#arrowMuted)"/>
    <text x="400" y="704" text-anchor="middle" fill="#6B7A91" font-size="16">Migration</text>
    <rect x="486" y="692" width="288" height="58" rx="15" fill="#E3EEFF"/>
    <text x="630" y="728" text-anchor="middle" fill="#244B82" font-size="19" font-weight="700">Legacy Importer</text>
    <path d="M 825 721 H 1025" fill="none" stroke="#8DA1BE" stroke-width="5" marker-end="url(#arrowMuted)"/>
  </g>

  <text x="105" y="842" fill="#28466F" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="22" font-weight="600">結果：前端保持簡單，服務負責處理邏輯，PostgreSQL 保存資料，Redis 加速即時狀態。</text>
</svg>
