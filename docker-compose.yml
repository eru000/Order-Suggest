services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ordersuggest
      POSTGRES_USER: ordersuggest
      POSTGRES_PASSWORD: ordersuggest
    ports:
      - "5432:5432"
    volumes:
      - ordersuggest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersuggest -d ordersuggest"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ordersuggest_postgres:
