name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python syntax
        run: python -m compileall -q src crawl_menu.py
      - name: Frontend syntax
        run: |
          node --check web/format.js
          node --check web/web.js
          node --check web/decision.js
          node --check web/conversation-scroll.js
      - name: Unit tests with coverage
        run: |
          coverage run -m unittest discover -s tests -p "test_*.py" -t tests
          coverage report --fail-under=60
      # 推薦結果的合理性檢查。不打 API（recommend() 是純本機計算），
      # 所以可以進 CI：抓「沒要酒卻配酒」「時價當成 0 元」這類看得見的錯。
      - name: Recommendation eval
        run: python evals/recommendation/run_eval.py
      - name: Ruff
        run: ruff check src/recommendation.py src/security.py src/session_store.py src/persistence.py src/menu_library.py src/decision_catalog.py src/decision_preferences.py src/decision_service.py src/conversation_service.py
      - name: Mypy
        run: mypy src/recommendation.py src/security.py src/session_store.py src/persistence.py src/decision_catalog.py src/decision_preferences.py src/decision_service.py src/conversation_service.py
